<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manhwa Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">

    <!-- ═══════════════════════════════════
         HEADER
         ═══════════════════════════════════ -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 4h6l2 2h8v12H4z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M8 12h8M8 15h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Manhwa Downloader</h1>
          <span class="brand-version">v1.0</span>
        </div>
      </div>
      <div class="app-status" id="appStatus">
        <span class="status-dot"></span>
        <span>Ready</span>
      </div>
    </header>

    <!-- ═══════════════════════════════════
         MAIN CONTENT
         ═══════════════════════════════════ -->
    <main class="app-main">

      <!-- Chapter Info Card -->
      <section class="card card-chapter">
        <div class="field">
          <label for="chapterName" class="field-label">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none">
              <path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Chapter Name
          </label>
          <input 
            type="text" 
            id="chapterName" 
            class="input"
            placeholder="Auto-detect..."
            spellcheck="false"
          >
        </div>
      </section>

      <!-- Settings Card -->
      <section class="card card-settings">
        <div class="card-title">
          <svg class="card-icon" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="2"/>
          </svg>
          <span>Settings</span>
        </div>

        <div class="settings-grid">
          <div class="field">
  <label for="namingFormat" class="field-label field-label-sm">Numbering</label>
  <select id="namingFormat" class="input select">
    <option value="auto" selected>✨ Auto (smart)</option>
    <option value="1digit">1, 2, 3</option>
    <option value="2digit">01, 02, 03</option>
    <option value="3digit">001, 002, 003</option>
    <option value="4digit">0001, 0002</option>
  </select>
  <span class="field-hint" id="formatHint">Auto-detect digit count</span>
</div>

          <div class="field">
            <label for="scanSpeed" class="field-label field-label-sm">Speed</label>
            <select id="scanSpeed" class="input select">
              <option value="slow">🐢 Slow</option>
              <option value="normal" selected>🚶 Normal</option>
              <option value="fast">🏃 Fast</option>
              <option value="turbo">⚡ Turbo</option>
            </select>
          </div>
        </div>

        <div class="field field-full">
          <label for="imageSelector" class="field-label field-label-sm">
            CSS Selector <span class="field-optional">(optional)</span>
          </label>
          <input 
            type="text" 
            id="imageSelector" 
            class="input input-sm"
            placeholder="#readerarea img"
            spellcheck="false"
          >
        </div>
      </section>

      <!-- Format Support -->
      <div class="format-support">
        <span class="format-label">Supported:</span>
        <div class="format-list">
          <span class="format-chip">JPG</span>
          <span class="format-chip">PNG</span>
          <span class="format-chip">WEBP</span>
          <span class="format-chip format-chip-special">
            <svg viewBox="0 0 24 24" fill="none" style="width:10px;height:10px;">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            BLOB
          </span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="actions">
        <button id="btnScan" class="btn btn-primary">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none">
            <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
            <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span>Auto Scan</span>
        </button>

        <button id="btnStop" class="btn btn-danger hidden">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none">
            <rect x="6" y="6" width="12" height="12" fill="currentColor" rx="1"/>
          </svg>
          <span>Stop</span>
        </button>
      </div>

      <button id="btnTestScroll" class="btn-ghost">
        🧪 Test Scroll Compatibility
      </button>

      <!-- Scan Progress -->
      <section id="scanProgress" class="card card-progress hidden">
        <div class="progress-header">
          <div class="progress-phase">
            <span class="phase-badge" id="scanPhase">Scanning</span>
          </div>
          <div class="progress-counter" id="scanCollected">0 / 0</div>
        </div>

        <div class="progress-track">
          <div class="progress-fill-animated" id="scanProgressFill"></div>
        </div>

        <div class="progress-footer">
          <span class="progress-message" id="scanMessage">Preparing...</span>
          <span class="progress-percent" id="scanPercent">0%</span>
        </div>
      </section>

      <!-- Preview Area -->
      <section id="previewArea" class="card card-preview hidden">
        <div class="preview-header">
          <div class="preview-stats">
            <svg class="preview-icon" viewBox="0 0 24 24" fill="none">
              <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
              <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
              <path d="M21 15l-5-5L5 21" stroke="currentColor" stroke-width="2"/>
            </svg>
            <span id="imageCount">0 images</span>
          </div>
          <button id="btnTogglePreview" class="btn-link">
            <span id="toggleText">Show</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none">
              <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div id="previewGrid" class="preview-grid hidden"></div>
      </section>

      <!-- Download Button -->
      <button id="btnDownload" class="btn btn-success btn-download hidden" disabled>
        <span class="btn-text">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Download ZIP</span>
        </span>
        <span class="btn-loading hidden">
          <span class="spinner"></span>
          <span id="progressText">0%</span>
        </span>
      </button>

      <!-- Download Progress -->
      <div id="progressBar" class="progress-track hidden">
        <div id="progressFill" class="progress-fill-animated"></div>
      </div>

      <!-- Status Message -->
      <div id="statusMessage" class="alert hidden"></div>

    </main>

    <!-- ═══════════════════════════════════
         FOOTER
         ═══════════════════════════════════ -->
    <footer class="app-footer">
      <div class="footer-tip">
        <svg class="tip-icon" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
          <path d="M12 16v-4M12 8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>Page will auto-scroll. Don't interact during scan.</span>
      </div>
    </footer>
  </div>

  <script src="../lib/jszip.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
